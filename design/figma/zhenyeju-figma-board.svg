<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="3040" viewBox="0 0 3400 3040">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111616"/><stop offset="1" stop-color="#080A0A"/></linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102323"/><stop offset=".56" stop-color="#171D1A"/><stop offset="1" stop-color="#050606"/></linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D7C394"/><stop offset="1" stop-color="#746A54"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4B3924"/><stop offset=".45" stop-color="#C2934B"/><stop offset="1" stop-color="#3E2C1D"/></linearGradient>
    <radialGradient id="moon"><stop stop-color="#72B9B6" stop-opacity=".25"/><stop offset="1" stop-color="#164649" stop-opacity="0"/></radialGradient>
    <radialGradient id="fire"><stop stop-color="#FFD27C" stop-opacity=".75"/><stop offset="1" stop-color="#FF6414" stop-opacity="0"/></radialGradient>
    <radialGradient id="danger"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#3C0000" stop-opacity=".88"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="screen"><rect width="750" height="1334" rx="38"/></clipPath>
    <style>
      .label{font:600 28px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#D8C7A4}
      .small{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#958A77}
      .ui{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:31px;font-weight:700;fill:#F0DFBD}
      .chapter{font-size:20px;font-weight:500;fill:#A38F73}
      .body{font-size:24px;font-weight:400;fill:#EFE1C6}
      .button{font-size:27px;font-weight:700;fill:#FFE8BF}
      .hint{font-size:21px;font-weight:600;fill:#FFD27C}
      .outline{stroke:#976843;stroke-width:2;fill:none}
    </style>
    <g id="base-room">
      <rect width="750" height="1334" fill="url(#room)"/>
      <circle cx="116" cy="250" r="260" fill="url(#moon)"/>
      <rect x="35" y="120" width="42" height="990" fill="#17201D"/><rect x="673" y="120" width="42" height="990" fill="#17201D"/>
      <rect x="20" y="110" width="710" height="32" fill="#293229"/><rect x="20" y="1075" width="710" height="28" fill="#293229"/>
      <g opacity=".12" stroke="#9AB9A2" stroke-width="2"><path d="M75 190L675 182"/><path d="M75 270L675 278"/><path d="M75 350L675 342"/><path d="M75 430L675 438"/><path d="M75 510L675 502"/><path d="M75 590L675 598"/><path d="M75 670L675 662"/><path d="M75 750L675 758"/><path d="M75 830L675 822"/><path d="M75 910L675 918"/><path d="M75 990L675 982"/></g>
    </g>
    <g id="header">
      <rect x="34" y="35" width="682" height="92" rx="18" fill="#040707" fill-opacity=".82" stroke="#98683F" stroke-opacity=".55" stroke-width="2"/>
      <rect x="552" y="54" width="132" height="54" rx="14" fill="#5D1C15" fill-opacity=".76"/>
    </g>
    <g id="message-panel">
      <rect x="38" y="1122" width="674" height="166" rx="22" fill="#030606" fill-opacity=".94" stroke="#945E37" stroke-opacity=".7" stroke-width="2"/>
      <text x="66" y="1156" class="ui" font-size="19" font-weight="700" fill="#AA8362">磁带记录</text>
    </g>
    <g id="lantern">
      <circle r="112" fill="url(#fire)"/><rect x="-25" y="-42" width="50" height="72" rx="12" fill="#6F2018"/><rect x="-18" y="-32" width="36" height="50" fill="none" stroke="#B9844F" stroke-width="3"/><rect x="-12" y="-25" width="24" height="38" fill="#FFD076" fill-opacity=".9"/>
    </g>
    <g id="ghost"><ellipse cx="0" cy="-170" rx="42" ry="55" fill="#020303"/><rect x="-38" y="-125" width="76" height="270" fill="#020303"/><rect x="-24" y="-178" width="12" height="5" fill="#A80D0D"/><rect x="12" y="-178" width="12" height="5" fill="#A80D0D"/></g>
  </defs>

  <rect width="3400" height="3040" fill="url(#board)"/>
  <text x="80" y="76" class="ui" font-size="42" font-weight="750" fill="#F1E2C6">镇夜局：纸门 · 微信小游戏 UI 设计板</text>
  <text x="80" y="120" class="small">750 × 1334 · 中式民俗恐怖 / 铜红、旧纸、冷青月光 / 可直接导入 Figma</text>

  <!-- 01 Intro -->
  <g transform="translate(80 190)" filter="url(#shadow)"><rect width="750" height="1334" rx="38" fill="#000"/>
    <g clip-path="url(#screen)"><use href="#base-room"/><use href="#lantern" transform="translate(140 300)"/><use href="#lantern" transform="translate(610 300)"/>
      <rect x="150" y="560" width="450" height="270" fill="#221817"/><rect x="175" y="590" width="400" height="45" fill="#49221B"/><rect x="205" y="660" width="340" height="130" fill="none" stroke="#7D5B3F" stroke-width="3"/>
      <rect y="250" width="750" height="820" fill="url(#danger)" opacity=".64"/>
      <text x="375" y="350" class="ui" text-anchor="middle" font-size="74" font-weight="800" fill="#D8C09A">镇 夜 局</text>
      <text x="375" y="433" class="ui" text-anchor="middle" font-size="39" font-weight="700" fill="#A5362D">纸 门</text>
      <text x="375" y="507" class="ui" text-anchor="middle" font-size="24" fill="#9F9A8A">姐姐失踪后的第七夜</text>
      <rect x="155" y="890" width="440" height="88" rx="20" fill="#712119" stroke="#C47B51" stroke-width="2"/><text x="375" y="946" class="ui button" text-anchor="middle">播放最后一盘磁带</text>
      <text x="375" y="1038" class="ui" text-anchor="middle" font-size="19" fill="#777F77">建议开启声音 · 佩戴耳机</text>
      <rect width="750" height="1334" fill="none" stroke="#3B3029" stroke-width="2"/>
    </g></g><text x="80" y="1566" class="label">01 / 启动页</text>

  <!-- 02 Seal -->
  <g transform="translate(910 190)" filter="url(#shadow)"><rect width="750" height="1334" rx="38" fill="#000"/>
    <g clip-path="url(#screen)"><use href="#base-room"/><use href="#lantern" transform="translate(115 330)"/><use href="#lantern" transform="translate(635 330)"/>
      <rect x="78" y="820" width="594" height="230" fill="#231915"/><rect x="55" y="810" width="640" height="38" fill="#4B2B20"/>
      <g transform="translate(270 650)"><rect x="-83" y="-83" width="166" height="166" rx="12" fill="#D1AD68" stroke="#6F261D" stroke-width="7"/><path d="M-50-15H5V-58H48M-45 28H42M-5-12V65" stroke="#7A211E" stroke-width="9" fill="none"/></g>
      <g transform="translate(480 650) rotate(270)"><rect x="-83" y="-83" width="166" height="166" rx="12" fill="#D1AD68" stroke="#6F261D" stroke-width="7"/><path d="M-50-15H5V-58H48M-45 28H42M-5-12V65" stroke="#7A211E" stroke-width="9" fill="none"/></g>
      <g transform="translate(270 870) rotate(180)"><rect x="-83" y="-83" width="166" height="166" rx="12" fill="#D1AD68" stroke="#6F261D" stroke-width="7"/><path d="M-50-15H5V-58H48M-45 28H42M-5-12V65" stroke="#7A211E" stroke-width="9" fill="none"/></g>
      <g transform="translate(480 870)"><rect x="-83" y="-83" width="166" height="166" rx="12" fill="#D1AD68" stroke="#6F261D" stroke-width="7"/><path d="M-50-15H5V-58H48M-45 28H42M-5-12V65" stroke="#7A211E" stroke-width="9" fill="none"/></g>
      <use href="#ghost" transform="translate(690 730)" opacity=".48"/><use href="#header"/><text x="62" y="69" class="ui chapter">第一幕 · 封门祖堂</text><text x="62" y="106" class="ui title">残符归位</text><text x="530" y="88" class="ui" text-anchor="end" font-size="30" font-weight="700" fill="#D8C7A4">46s</text><text x="618" y="89" class="ui" text-anchor="middle" font-size="24" font-weight="700" fill="#F0D7A5">求助</text>
      <use href="#message-panel"/><text x="66" y="1202" class="ui body">纸门封死了。桌上的四块残印，</text><text x="66" y="1235" class="ui body">也许能重新组成镇尸符。</text><rect width="750" height="1334" fill="url(#danger)" opacity=".38"/>
    </g></g><text x="910" y="1566" class="label">02 / 第一幕 · 残符归位</text>

  <!-- 03 Bells -->
  <g transform="translate(1740 190)" filter="url(#shadow)"><rect width="750" height="1334" rx="38" fill="#000"/>
    <g clip-path="url(#screen)"><use href="#base-room"/><rect x="100" y="295" width="550" height="620" fill="#111918" stroke="#3A4A42" stroke-width="8"/>
      <g fill="url(#brass)" stroke="#C19958" stroke-width="5"><path d="M140 515Q95 575 84 685Q170 728 256 685Q245 575 200 515Z"/><path d="M345 485Q300 545 289 655Q375 698 461 655Q450 545 405 485Z"/><path d="M550 515Q505 575 494 685Q580 728 666 685Q655 575 610 515Z"/></g>
      <g stroke="#54402E" stroke-width="8"><path d="M170 430V515"/><path d="M375 400V485"/><path d="M580 430V515"/></g>
      <g class="ui" font-size="24" fill="#968870" text-anchor="middle"><text x="170" y="800">短</text><text x="375" y="800">中</text><text x="580" y="800">长</text></g>
      <g><circle cx="312" cy="920" r="11" fill="#C98D46"/><circle cx="354" cy="920" r="11" fill="#C98D46"/><circle cx="396" cy="920" r="11" fill="#2D3834"/><circle cx="438" cy="920" r="11" fill="#2D3834"/></g>
      <use href="#ghost" transform="translate(680 735)" opacity=".58"/><use href="#header"/><text x="62" y="69" class="ui chapter">第二幕 · 暗室铃音</text><text x="62" y="106" class="ui title">三铃镇尸</text><text x="530" y="88" class="ui" text-anchor="end" font-size="30" font-weight="700" fill="#FF655C">18s</text><text x="618" y="89" class="ui" text-anchor="middle" font-size="24" font-weight="700" fill="#F0D7A5">求助</text>
      <use href="#message-panel"/><text x="66" y="1202" class="ui body">磁带里传来姐姐的低语：</text><text x="66" y="1235" class="ui body">短、长、中、短。</text><rect width="750" height="1334" fill="url(#danger)" opacity=".68"/>
    </g></g><text x="1740" y="1566" class="label">03 / 第二幕 · 三铃镇尸</text>

  <!-- 04 Doors -->
  <g transform="translate(2570 190)" filter="url(#shadow)"><rect width="750" height="1334" rx="38" fill="#000"/>
    <g clip-path="url(#screen)"><use href="#base-room"/><path d="M70 980H680L750 1120H0Z" fill="#090B09"/>
      <g><rect x="92" y="370" width="166" height="430" fill="#2A1C17"/><rect x="108" y="388" width="134" height="388" fill="url(#door)" stroke="#5F3025" stroke-width="6"/><circle cx="175" cy="578" r="36" fill="none" stroke="#514A3D" stroke-width="5"/>
      <rect x="292" y="370" width="166" height="430" fill="#2A1C17"/><rect x="308" y="388" width="134" height="388" fill="url(#door)" stroke="#8B1D1C" stroke-width="6"/><path d="M375 533L412 606H338Z" fill="none" stroke="#8B1D1C" stroke-width="5"/><circle cx="375" cy="680" r="19" fill="#7E1D1B"/>
      <rect x="492" y="370" width="166" height="430" fill="#2A1C17"/><rect x="508" y="388" width="134" height="388" fill="url(#door)" stroke="#5F3025" stroke-width="6"/><rect x="541" y="548" width="68" height="68" fill="none" stroke="#514A3D" stroke-width="5"/></g>
      <g stroke="#77634A" stroke-width="5"><path d="M127 960H223"/><path d="M327 960H423"/><path d="M527 960H623"/></g>
      <g><circle cx="207" cy="900" r="70" fill="url(#fire)"/><path d="M207 880Q225 905 207 920Q189 905 207 880" fill="#F2B650"/><circle cx="343" cy="900" r="70" fill="url(#fire)"/><path d="M343 880Q361 905 343 920Q325 905 343 880" fill="#F2B650"/><circle cx="575" cy="900" r="70" fill="url(#fire)"/><path d="M575 880Q593 905 575 920Q557 905 575 880" fill="#F2B650"/></g>
      <g class="ui" text-anchor="middle" font-size="19" fill="#A99878"><text x="175" y="1030">3</text><text x="375" y="1030">1</text><text x="575" y="1030">2</text></g>
      <use href="#header"/><text x="62" y="69" class="ui chapter">第三幕 · 无尽长廊</text><text x="62" y="106" class="ui title">纸门照影</text><text x="530" y="88" class="ui" text-anchor="end" font-size="30" font-weight="700" fill="#D8C7A4">39s</text><text x="618" y="89" class="ui" text-anchor="middle" font-size="24" font-weight="700" fill="#F0D7A5">求助</text>
      <use href="#message-panel"/><text x="66" y="1202" class="ui body">烛影重合。中间纸门上，</text><text x="66" y="1235" class="ui body">浮出了姐姐留下的指印。</text><rect width="750" height="1334" fill="url(#danger)" opacity=".42"/>
    </g></g><text x="2570" y="1566" class="label">04 / 第三幕 · 纸门照影</text>

  <!-- 05 Hint -->
  <g transform="translate(80 1660)" filter="url(#shadow)"><rect width="750" height="1334" rx="38" fill="#000"/>
    <g clip-path="url(#screen)"><use href="#base-room"/><g opacity=".42"><rect x="100" y="295" width="550" height="620" fill="#111918" stroke="#3A4A42" stroke-width="8"/><circle cx="170" cy="650" r="90" fill="#806039"/><circle cx="375" cy="620" r="90" fill="#806039"/><circle cx="580" cy="650" r="90" fill="#806039"/></g><rect width="750" height="1334" fill="#000" opacity=".46"/>
      <use href="#header"/><text x="62" y="69" class="ui chapter">第二幕 · 暗室铃音</text><text x="62" y="106" class="ui title">三铃镇尸</text><text x="530" y="88" class="ui" text-anchor="end" font-size="30" font-weight="700" fill="#D8C7A4">31s</text><text x="618" y="89" class="ui" text-anchor="middle" font-size="24" font-weight="700" fill="#F0D7A5">求助</text>
      <rect x="65" y="925" width="620" height="190" rx="22" fill="#5B3D16" fill-opacity=".96" stroke="#B7863F" stroke-width="2"/><text x="95" y="976" class="ui hint">提示</text><text x="95" y="1023" class="ui" font-size="23" fill="#FFF0CF">按“短、长、中、短”的顺序敲铃，</text><text x="95" y="1058" class="ui" font-size="23" fill="#FFF0CF">也就是依次点击左、右、中、左。</text>
      <use href="#message-panel"/><text x="66" y="1202" class="ui body">门后的指甲声越来越近。</text><text x="66" y="1235" class="ui body">这次别再敲错了。</text>
    </g></g><text x="80" y="3036" class="label">05 / 游戏内提示状态</text>

  <!-- 06 Failure -->
  <g transform="translate(910 1660)" filter="url(#shadow)"><rect width="750" height="1334" rx="38" fill="#000"/>
    <g clip-path="url(#screen)"><use href="#base-room"/><rect width="750" height="1334" fill="#020404" opacity=".8"/><rect x="66" y="268" width="618" height="760" rx="30" fill="#0B0D0C" stroke="#7D372D" stroke-width="3"/><rect x="96" y="268" width="558" height="8" fill="#8D2923"/>
      <text x="375" y="365" class="ui" text-anchor="middle" font-size="48" font-weight="800" fill="#F0DFBD">时间到了</text><text x="375" y="430" class="ui" text-anchor="middle" font-size="23" fill="#A99D89">纸门后的人影已经站在你身后。</text>
      <text x="375" y="555" class="ui" text-anchor="middle" font-size="27" font-weight="700" fill="#D6C5A6">要不要再试一次？</text>
      <rect x="112" y="604" width="526" height="86" rx="19" fill="#7B261F"/><text x="375" y="658" class="ui button" text-anchor="middle">再试一次</text>
      <rect x="112" y="720" width="526" height="102" rx="19" fill="#704E1F"/><text x="375" y="763" class="ui" text-anchor="middle" font-size="27" font-weight="800" fill="#FFDB8C">看广告 3 秒</text><text x="375" y="802" class="ui" text-anchor="middle" font-size="21" fill="#EFE2C2">立即获取本关通关秘籍</text>
      <text x="375" y="916" class="ui" text-anchor="middle" font-size="18" fill="#6F6860">失败页不打断恐怖氛围，主操作始终清晰</text>
    </g></g><text x="910" y="3036" class="label">06 / 超时失败与复活</text>

  <!-- 07 Ad Secret -->
  <g transform="translate(1740 1660)" filter="url(#shadow)"><rect width="750" height="1334" rx="38" fill="#000"/>
    <g clip-path="url(#screen)"><use href="#base-room"/><rect width="750" height="1334" fill="#020404" opacity=".8"/><rect x="66" y="268" width="618" height="760" rx="30" fill="#0B0D0C" stroke="#7D372D" stroke-width="3"/><rect x="96" y="268" width="558" height="8" fill="#8D2923"/>
      <text x="375" y="365" class="ui" text-anchor="middle" font-size="48" font-weight="800" fill="#F0DFBD">时间到了</text><rect x="120" y="500" width="510" height="310" rx="24" fill="#402A13" fill-opacity=".86"/>
      <text x="375" y="570" class="ui" text-anchor="middle" font-size="25" font-weight="700" fill="#E4C58A">广告播放中</text><circle cx="375" cy="680" r="86" fill="none" stroke="#5B4829" stroke-width="14"/><path d="M375 594A86 86 0 0 1 449 723" fill="none" stroke="#FFCB65" stroke-width="14" stroke-linecap="round"/><text x="375" y="706" class="ui" text-anchor="middle" font-size="82" font-weight="800" fill="#FFCB65">2</text>
      <text x="375" y="770" class="ui" text-anchor="middle" font-size="21" fill="#B9A983">看完即可解锁本关通关秘籍</text><text x="375" y="880" class="ui" text-anchor="middle" font-size="21" fill="#776E60">请勿退出</text>
    </g></g><text x="1740" y="3036" class="label">07 / 激励广告倒计时</text>

  <!-- 08 Ending -->
  <g transform="translate(2570 1660)" filter="url(#shadow)"><rect width="750" height="1334" rx="38" fill="#000"/>
    <g clip-path="url(#screen)"><use href="#base-room"/><use href="#lantern" transform="translate(375 420) scale(1.7)"/><rect width="750" height="1334" fill="#000" opacity=".64"/>
      <text x="375" y="410" class="ui" text-anchor="middle" font-size="58" font-weight="800" fill="#DDC69D">第一夜 · 完</text><text x="375" y="492" class="ui" text-anchor="middle" font-size="25" fill="#9FA298">你找到了姐姐的第二盘磁带</text>
      <rect x="95" y="580" width="560" height="245" rx="22" fill="#080A09" fill-opacity=".92" stroke="#59422F"/><text x="375" y="648" class="ui" text-anchor="middle" font-size="25" fill="#E7D8BE">门后没有出口，只有姐姐的</text><text x="375" y="688" class="ui" text-anchor="middle" font-size="25" fill="#E7D8BE">第二盘磁带。纸门在你身后</text><text x="375" y="728" class="ui" text-anchor="middle" font-size="25" fill="#E7D8BE">缓缓合拢……</text><text x="375" y="790" class="ui" text-anchor="middle" font-size="23" font-weight="700" fill="#A94336">第二夜：赶尸客栈</text>
      <rect x="150" y="920" width="450" height="84" rx="20" fill="#6F241D"/><text x="375" y="973" class="ui button" text-anchor="middle">重新体验</text>
    </g></g><text x="2570" y="3036" class="label">08 / 章节结局</text>
</svg>
