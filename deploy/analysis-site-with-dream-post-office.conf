server {
    listen 8083;
    server_name _;

    root /var/www/analysis-site;
    index index.html;

    location = /dream-post-office {
        return 301 /dream-post-office/;
    }

    location ^~ /dream-post-office/ {
        alias /var/www/dream-post-office/;
        index index.html;
    }

    location = /five-phase-locks {
        return 301 /five-phase-locks/;
    }

    location ^~ /five-phase-locks/assets/ {
        alias /var/www/five-phase-locks/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /five-phase-locks/ {
        alias /var/www/five-phase-locks/;
        index index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
